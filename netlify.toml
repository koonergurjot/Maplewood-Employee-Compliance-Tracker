[build]
  command = "npm install && npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Keep the permissions policy limited to widely supported directives to avoid
    # console warnings about experimental ad-tech features (browsing-topics,
    # run-ad-auction, etc.) that require origin trials. Explicitly defining the
    # policy here keeps Netlify from appending those directives automatically.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker-selection=(), vibrate=(), fullscreen=(self)"

[[redirects]]
  from = "/calendar.html"
  to = "/calendar.html"
  status = 200

[[redirects]]
  from = "/clear-cache.html"
  to = "/clear-cache.html"
  status = 200

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
