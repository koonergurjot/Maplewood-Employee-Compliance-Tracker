<div x-data="complianceGrid()" class="h-screen w-screen overflow-hidden bg-slate-50 flex flex-col">
  <!-- Toolbar -->
  <div class="flex-none flex items-center gap-3 px-4 py-3 border-b bg-white">
    <h1 class="text-xl font-semibold">Compliance Matrix</h1>
    <div class="ml-auto flex items-center gap-2">
      <button @click="fitToWidth()" class="px-3 py-1.5 text-sm rounded-md border hover:bg-slate-100">Fit to width</button>
      <button @click="resetZoom()" class="px-3 py-1.5 text-sm rounded-md border hover:bg-slate-100">Reset</button>
    </div>
  </div>

  <!-- Scroll area -->
  <div class="flex-1 min-h-0 w-full overflow-auto" x-ref="scroller">
    <div class="min-w-max"
         :style="`display:grid; grid-template-columns: 260px repeat(${requirements.length}, minmax(var(--cellMin,120px), 1fr));`">
      <!-- Sticky headers -->
      <div class="sticky top-0 z-30 col-start-1 row-start-1 bg-white border-b border-slate-200">
        <div class="h-12 flex items-center px-3 font-medium">Employee</div>
      </div>
      <template x-for="(req, i) in requirements" :key="req.id">
        <div class="sticky top-0 z-20 bg-white border-b border-slate-200 h-12 flex items-center justify-center text-sm font-medium"
             :style="`grid-column: ${i+2};`" x-text="req.label"></div>
      </template>

      <!-- Rows -->
      <template x-for="emp in employees" :key="emp.id">
        <template>
          <!-- Sticky name cell -->
          <div class="sticky left-0 z-10 bg-white border-b border-slate-200 h-12 flex items-center gap-3 px-3">
            <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-slate-800 text-white text-xs font-semibold"
                  x-text="emp.initials"></span>
            <div class="flex flex-col leading-tight">
              <span class="font-medium" x-text="emp.name"></span>
              <span class="text-xs text-slate-500" x-text="emp.meta || ''"></span>
            </div>
          </div>

          <!-- Requirement cells -->
          <template x-for="req in requirements" :key="emp.id + '_' + req.id">
            <button class="border-b border-slate-200 h-12 w-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-sky-400"
                    @click="toggle($event, emp.id, req.id)" :title="emp.name + ' • ' + req.label">
              <span class="px-2 py-0.5 rounded-full text-xs"
                    :class="cellClass(emp.id, req.id)"
                    x-text="cellLabel(emp.id, req.id)"></span>
            </button>
          </template>
        </template>
      </template>
    </div>
  </div>
</div>
