<div
  id="employee-profile-root"
  x-cloak
  class="fixed inset-0 z-50 flex items-stretch justify-end pointer-events-none"
  :class="{ 'aria-hidden': !$store.app.overlay || $store.app.overlay.current !== 'profile' }"
  :aria-hidden="!$store.app.overlay || $store.app.overlay.current !== 'profile'"
>
  <div
    x-cloak
    x-show="profilePanel.open"
    x-transition.opacity.duration.150ms
    class="fixed inset-0 bg-black/40 pointer-events-none"
  ></div>
  <button
    type="button"
    x-cloak
    x-show="profilePanel.open"
    class="fixed inset-0 h-full w-full cursor-default pointer-events-auto"
    @click="closeProfile()"
    aria-hidden="true"
    tabindex="-1"
  ></button>
  <aside
    x-cloak
    x-show="profilePanel.open"
    x-transition:enter="transform transition ease-out duration-200"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transform transition ease-in duration-150"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    class="pointer-events-auto relative z-50 h-full w-full max-w-lg overflow-hidden border-l border-slate-200 bg-white shadow-xl dark:border-slate-700 dark:bg-slate-900"
    role="dialog"
    aria-modal="true"
    aria-labelledby="employee-profile-title"
    @keydown.escape.window.stop="closeProfile()"
  >
    <div class="flex h-full flex-col">
      <header class="border-b border-slate-200 bg-white px-6 py-5 dark:border-slate-700 dark:bg-slate-900">
        <div class="flex items-start justify-between gap-4">
          <div class="flex items-center gap-3">
            <div class="relative">
              <div
                class="grid h-12 w-12 place-items-center rounded-full bg-indigo-100 text-base font-semibold text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-200"
                x-text="profileEmployeeInitials()"
              ></div>
              <svg viewBox="0 0 24 24" class="absolute -bottom-1 -right-1 h-6 w-6">
                <circle cx="12" cy="12" r="10" stroke-width="3" fill="none" class="stroke-slate-200"></circle>
                <circle
                  cx="12"
                  cy="12"
                  r="10"
                  stroke-width="3"
                  fill="none"
                  :style="`stroke-dasharray:${profileComplianceDash()} 62.83;transition:stroke-dasharray .25s`"
                  :class="profileComplianceStrokeClass()"
                ></circle>
              </svg>
            </div>
            <div class="min-w-0">
              <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Profile</p>
              <h2
                id="employee-profile-title"
                class="truncate text-lg font-semibold text-slate-900 dark:text-slate-50"
                x-text="profileEmployeeName()"
              ></h2>
              <p class="mt-1 text-sm text-slate-500 dark:text-slate-400" x-text="profileEmployeeMeta()"></p>
            </div>
          </div>
          <button
            type="button"
            class="rounded-full p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-500 dark:hover:bg-slate-800 dark:hover:text-slate-200"
            @click="closeProfile()"
            aria-label="Close employee details"
            data-autofocus
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </header>
      <div class="flex-1 overflow-y-auto px-6 py-5">
        <template x-if="profileEmployee()">
          <div class="space-y-8">
            <section class="grid gap-4 sm:grid-cols-2">
              <article class="rounded-xl border border-slate-200 bg-slate-50/80 p-4 dark:border-slate-700 dark:bg-slate-800/50">
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Compliance</h3>
                <p class="mt-2 text-3xl font-semibold text-slate-900 dark:text-slate-100">
                  <span x-text="profileCompliancePercent()"></span>
                  <span class="text-lg font-normal text-slate-500 dark:text-slate-400">%</span>
                </p>
              </article>
              <article class="rounded-xl border border-slate-200 bg-slate-50/80 p-4 dark:border-slate-700 dark:bg-slate-800/50">
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Attention</h3>
                <p class="mt-2 text-sm text-slate-600 dark:text-slate-300" x-text="profileAttentionSummary()"></p>
              </article>
            </section>

            <section class="space-y-4">
              <form class="space-y-4" @submit.prevent="saveProfileChanges">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
                    Employee Information
                  </h3>
                  <template x-if="!profilePanel.editing">
                    <button type="button" class="btn ghost" @click="startProfileEdit">Edit</button>
                  </template>
                  <template x-if="profilePanel.editing">
                    <div class="flex items-center gap-2">
                      <button
                        type="button"
                        class="btn ghost"
                        @click="cancelProfileEdit"
                        :disabled="profilePanel.saving"
                      >
                        Cancel
                      </button>
                      <button type="submit" class="btn primary" :disabled="profilePanel.saving">
                        <span x-show="!profilePanel.saving">Save changes</span>
                        <span x-show="profilePanel.saving">Saving…</span>
                      </button>
                    </div>
                  </template>
                </div>
                <p
                  x-show="profilePanel.error"
                  class="rounded border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700 dark:border-rose-800/60 dark:bg-rose-500/10 dark:text-rose-200"
                  x-text="profilePanel.error"
                ></p>
                <template x-if="!profilePanel.editing">
                  <dl class="grid grid-cols-1 gap-3 text-sm text-slate-600 dark:text-slate-300">
                    <template x-for="row in profileInfoRows()" :key="row.key">
                      <div class="flex justify-between gap-3">
                        <dt class="text-slate-500 dark:text-slate-400" x-text="row.label"></dt>
                        <dd class="font-medium text-slate-900 dark:text-slate-100" x-text="row.value || '—'"></dd>
                      </div>
                    </template>
                  </dl>
                </template>
                <template x-if="profilePanel.editing">
                  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <label class="flex flex-col gap-1 text-sm sm:col-span-2">
                      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Name</span>
                      <input
                        type="text"
                        class="input"
                        placeholder="First and last name"
                        x-model="profilePanel.form.name"
                        :disabled="profilePanel.saving"
                        data-profile-autofocus
                        required
                      />
                    </label>
                    <label class="flex flex-col gap-1 text-sm">
                      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Seniority Hours</span>
                      <input
                        type="text"
                        class="input"
                        inputmode="decimal"
                        x-model="profilePanel.form.seniorityHours"
                        :disabled="profilePanel.saving"
                      />
                    </label>
                    <label class="flex flex-col gap-1 text-sm">
                      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Job Class</span>
                      <input
                        type="text"
                        class="input"
                        x-model="profilePanel.form.jobClass"
                        :disabled="profilePanel.saving"
                      />
                    </label>
                    <label class="flex flex-col gap-1 text-sm">
                      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Job Title</span>
                      <input
                        type="text"
                        class="input"
                        x-model="profilePanel.form.jobTitle"
                        :disabled="profilePanel.saving"
                      />
                    </label>
                    <label class="flex flex-col gap-1 text-sm">
                      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Ranking</span>
                      <input
                        type="text"
                        class="input"
                        x-model="profilePanel.form.ranking"
                        :disabled="profilePanel.saving"
                      />
                    </label>
                    <label class="flex flex-col gap-1 text-sm">
                      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Position Status</span>
                      <input
                        type="text"
                        class="input"
                        x-model="profilePanel.form.positionStatus"
                        :disabled="profilePanel.saving"
                      />
                    </label>
                  </div>
                </template>
              </form>
            </section>

            <section class="space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
                  Requirements
                </h3>
              </div>
              <template x-if="profileAssignments().length">
                <ul class="space-y-3" role="list">
                  <template x-for="item in profileAssignments()" :key="item.key">
                    <li class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900/60">
                      <div class="flex flex-wrap items-center justify-between gap-3">
                        <div>
                          <p class="font-medium text-slate-900 dark:text-slate-100" x-text="item.name"></p>
                          <p class="text-xs text-slate-500 dark:text-slate-400" x-text="item.statusLabel"></p>
                        </div>
                        <span class="badge" :class="item.badgeClass" x-text="item.badgeLabel"></span>
                      </div>
                      <p class="mt-2 text-xs text-slate-500 dark:text-slate-400" x-text="item.subtext"></p>
                      <dl class="mt-3 grid grid-cols-2 gap-3 text-xs text-slate-500 dark:text-slate-400">
                        <div>
                          <dt class="font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">Completed</dt>
                          <dd class="text-slate-700 dark:text-slate-300" x-text="item.completedOn"></dd>
                        </div>
                        <div>
                          <dt class="font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">Expires</dt>
                          <dd class="text-slate-700 dark:text-slate-300" x-text="item.expiresOn"></dd>
                        </div>
                      </dl>
                    </li>
                  </template>
                </ul>
              </template>
              <template x-if="!profileAssignments().length">
                <p class="text-sm text-slate-500 dark:text-slate-400">No requirements are assigned to this employee yet.</p>
              </template>
            </section>
          </div>
        </template>
        <template x-if="!profileEmployee()">
          <p class="text-sm text-slate-500 dark:text-slate-400">This employee is no longer available.</p>
        </template>
      </div>
    </div>
  </aside>
</div>
