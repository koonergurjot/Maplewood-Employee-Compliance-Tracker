<section class="card" aria-label="Compliance highlights">
  <div class="space-y-6 p-4 sm:p-6">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
      <div class="space-y-1">
        <h2 class="text-lg font-semibold leading-tight">Compliance highlights</h2>
        <p class="text-sm text-muted">Spot trends and jump directly to the employees who need help.</p>
      </div>
      <button
        type="button"
        class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-300"
        x-show="filters.analytics"
        @click="clearAnalyticsFilter"
      >
        Clear highlight
      </button>
    </div>

    <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
      <article class="space-y-3">
        <header class="space-y-1">
          <h3 class="text-xs font-semibold uppercase tracking-wide text-muted">Top at-risk requirements</h3>
          <p class="text-xs text-muted" x-text="analytics.totals.atRiskAssignments ? `${analytics.totals.atRiskAssignments} assignments need attention` : 'All requirements are on track.'"></p>
        </header>
        <div class="flex flex-wrap gap-2">
          <template x-if="analytics.atRisk.length">
            <template x-for="item in analytics.atRisk" :key="item.requirementId">
              <button
                type="button"
                :class="analyticsChipClass(isRequirementRiskFilterActive(item.requirementId))"
                :aria-pressed="isRequirementRiskFilterActive(item.requirementId)"
                @click="applyRequirementRiskFilter(item)"
              >
                <div class="min-w-0 flex-1 text-left">
                  <span class="block truncate font-semibold" x-text="item.name"></span>
                  <span
                    class="block text-xs text-muted"
                    x-text="`Overdue ${item.overdueCount} · Upcoming ${item.expiringSoonCount}`"
                  ></span>
                </div>
                <span class="rounded-full bg-red-100 px-2 py-0.5 text-xs font-semibold text-red-600 dark:bg-red-500/20 dark:text-red-200" x-text="item.atRiskCount"></span>
              </button>
            </template>
          </template>
          <template x-if="!analytics.atRisk.length">
            <p class="text-sm text-muted">No requirements are currently at risk.</p>
          </template>
        </div>
      </article>

      <article class="space-y-3">
        <header class="space-y-1">
          <h3 class="text-xs font-semibold uppercase tracking-wide text-muted">Compliance by role</h3>
          <p class="text-xs text-muted">Lowest average completion rates across roles.</p>
        </header>
        <div class="flex flex-wrap gap-2">
          <template x-if="analytics.complianceByRole.length">
            <template x-for="item in analytics.complianceByRole" :key="item.role || 'unassigned'">
              <button
                type="button"
                :class="analyticsChipClass(isRoleFilterActive(item.role || ''))"
                :aria-pressed="isRoleFilterActive(item.role || '')"
                @click="applyRoleFilterFromAnalytics(item.role || '')"
              >
                <div class="min-w-0 flex-1 text-left">
                  <span class="block truncate font-semibold" x-text="item.role || 'Unassigned'"></span>
                  <span
                    class="block text-xs text-muted"
                    x-text="item.employeeCount === 1 ? '1 employee' : `${item.employeeCount} employees`"
                  ></span>
                </div>
                <span class="rounded-full bg-slate-200 px-2 py-0.5 text-xs font-semibold text-slate-700 dark:bg-slate-700 dark:text-slate-100" x-text="item.averageCompliance + '%'">
                </span>
              </button>
            </template>
          </template>
          <template x-if="!analytics.complianceByRole.length">
            <p class="text-sm text-muted">Add more employees to calculate role compliance.</p>
          </template>
        </div>
      </article>

      <article class="space-y-3">
        <header class="space-y-1">
          <h3 class="text-xs font-semibold uppercase tracking-wide text-muted">Expiring this week</h3>
          <p class="text-xs text-muted">Assignments due within the next 7 days.</p>
        </header>
        <div class="flex flex-wrap gap-2">
          <template x-if="analytics.totals.expiringThisWeek">
            <button
              type="button"
              :class="analyticsChipClass(isExpiringWeekFilterActive(null))"
              :aria-pressed="isExpiringWeekFilterActive(null)"
              @click="applyExpiringWeekFilter()"
            >
              <div class="min-w-0 flex-1 text-left">
                <span class="block font-semibold">All expiring</span>
                <span class="block text-xs text-muted">Next 7 days</span>
              </div>
              <span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-700 dark:bg-amber-500/20 dark:text-amber-200" x-text="analytics.totals.expiringThisWeek"></span>
            </button>
          </template>
          <template x-if="analytics.expiringThisWeek.length">
            <template x-for="item in analytics.expiringThisWeek" :key="item.requirementId">
              <button
                type="button"
                :class="analyticsChipClass(isExpiringWeekFilterActive(item.requirementId))"
                :aria-pressed="isExpiringWeekFilterActive(item.requirementId)"
                @click="applyExpiringWeekFilter(item.requirementId)"
              >
                <div class="min-w-0 flex-1 text-left">
                  <span class="block truncate font-semibold" x-text="item.name"></span>
                  <span class="block text-xs text-muted">Due this week</span>
                </div>
                <span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-700 dark:bg-amber-500/20 dark:text-amber-200" x-text="item.count"></span>
              </button>
            </template>
          </template>
          <template x-if="!analytics.totals.expiringThisWeek">
            <p class="text-sm text-muted">No requirements expire this week.</p>
          </template>
        </div>
      </article>
    </div>
  </div>
</section>
