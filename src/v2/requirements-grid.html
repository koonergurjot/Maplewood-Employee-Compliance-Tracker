<div id="bulk-actions" class="bulk-actions-slot" x-html="partials.bulkActions"></div>
<div class="grid-container">
  <template x-if="loading">
    <div class="p-6 space-y-3">
      <div class="h-6 w-1/3 bg-slate-200 animate-pulse rounded"></div>
      <div class="h-48 bg-slate-100 animate-pulse rounded-xl"></div>
    </div>
  </template>

  <template x-if="!loading && filteredEmployees.length===0">
    <div class="card p-8 text-center">
      <h3 class="text-lg font-semibold">No matches</h3>
      <p class="text-slate-500 mt-1">Try adjusting filters or import employees.</p>
      <div class="mt-4 flex justify-center gap-2">
        <button class="btn btn-primary" @click="openImportDrawer()">Open Import</button>
        <button class="btn" @click="downloadSampleCSV()">Download Sample CSV</button>
      </div>
    </div>
  </template>

  <div class="grid-scroll" role="region" aria-label="Scrollable requirements table" x-show="!loading && filteredEmployees.length">
    <table class="min-w-full text-sm text-slate-700 requirements-table">
      <thead class="text-xs uppercase tracking-wide text-slate-500">
        <tr>
          <th scope="col" class="sticky-header sticky left-0 px-4 py-3 text-left">Employee</th>
          <template x-for="req in gridOrderedRequirements()" :key="req.id">
            <th class="sticky-header px-4 py-3 text-left whitespace-nowrap" x-text="req.name"></th>
          </template>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
        <template x-for="employee in filteredEmployees" :key="employee.id">
          <tr class="bg-white">
            <th scope="row" class="sticky left-0 bg-white px-4 py-3 align-top">
              <div class="flex items-start gap-3">
                <div class="relative h-8 w-8 shrink-0 rounded-full bg-indigo-100 text-indigo-700 grid place-items-center text-xs font-semibold">
                  <span x-text="(employee.firstName?.[0]||'') + (employee.lastName?.[0]||'')"></span>
                  <svg viewBox="0 0 24 24" class="absolute -bottom-1 -right-1 h-5 w-5">
                    <circle cx="12" cy="12" r="10" stroke-width="3" fill="none" class="stroke-slate-200"></circle>
                    <circle
                      cx="12"
                      cy="12"
                      r="10"
                      stroke-width="3"
                      fill="none"
                      :style="`stroke-dasharray:${(employeeCompliancePercent(employee.id)/100)*62.83} 62.83;transition:stroke-dasharray .25s`"
                      :class="employeeCompliancePercent(employee.id)>=90?'stroke-emerald-500':employeeCompliancePercent(employee.id)>=70?'stroke-amber-500':'stroke-rose-500'"
                    ></circle>
                  </svg>
                </div>
                <div class="min-w-0 flex-1 space-y-1">
                  <div class="font-medium text-slate-900" x-text="employee.fullName || (employee.firstName+' '+employee.lastName)"></div>
                  <div class="text-xs text-slate-500">
                    <span x-text="employee.role || '—'"></span>
                    <span class="mx-1 text-slate-400" aria-hidden="true">•</span>
                    <span x-text="employee.status || '—'"></span>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    class="text-slate-400 hover:text-slate-600"
                    @click.stop="openProfile(employee.id)"
                    title="Employee details"
                  >
                    ⋯
                  </button>
                  <button
                    type="button"
                    class="text-xs font-medium text-rose-600 hover:text-rose-700"
                    title="Delete employee"
                    @click.stop="confirmAndDeleteEmployee(employee.id)"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </th>
            <template x-for="req in gridOrderedRequirements()" :key="req.id">
              <td class="px-4 py-3 align-top">
                <div x-data="requirementCell(employee.id, req.id)" x-init="init()" class="flex items-center gap-2">
                  <input
                    type="checkbox"
                    class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                    :checked="checked"
                    @change="onToggle($event.target.checked)"
                  />
                  <span class="text-xs font-medium px-2 py-0.5 rounded" :class="badgeClass" x-text="label"></span>
                </div>
              </td>
            </template>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
