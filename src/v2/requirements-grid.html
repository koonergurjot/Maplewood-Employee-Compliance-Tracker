<div class="grid-container">
  <div class="grid-scroll" role="region" aria-label="Scrollable requirements table">
    <table class="requirements-table">
      <thead>
        <tr>
          <th scope="col" class="sticky-col sticky-header">
            <span>Employee</span>
          </th>
          <template x-for="req in requirements" :key="req.id">
            <th scope="col" class="sticky-header">
              <div class="requirement-head">
                <span class="requirement-name" x-text="req.name"></span>
                <span class="requirement-tag" x-show="req.defaultExpiryDays" x-text="req.defaultExpiryDays + 'd'"></span>
              </div>
            </th>
          </template>
        </tr>
      </thead>
      <tbody>
        <template x-if="loading">
          <tr>
            <td class="sticky-col">
              <div class="empty-state">Loading employees…</div>
            </td>
            <td :colspan="Math.max(requirements.length, 1)">
              <div class="empty-state muted">Preparing compliance data</div>
            </td>
          </tr>
        </template>
        <template x-if="!loading && !filteredEmployees.length">
          <tr>
            <td class="sticky-col">
              <div class="empty-state">No employees found</div>
            </td>
            <td :colspan="Math.max(requirements.length, 1)">
              <div class="empty-state muted">Adjust your filters or clear the search to see more results.</div>
            </td>
          </tr>
        </template>
        <template x-for="employee in filteredEmployees" :key="employee.id">
          <tr>
            <th scope="row" class="sticky-col">
              <div class="employee-cell">
                <div class="ring-wrapper" :class="progressStrokeClass(employeeCompliancePercent(employee.id))">
                  <svg viewBox="0 0 36 36" class="ring">
                    <circle class="ring-track" cx="18" cy="18" r="16" />
                    <circle class="ring-value" cx="18" cy="18" r="16" :stroke-dasharray="progressRingDash(employeeCompliancePercent(employee.id))"></circle>
                  </svg>
                  <span class="ring-label" x-text="employeeCompliancePercent(employee.id) + '%'"></span>
                </div>
                <div class="employee-meta">
                  <div class="employee-name" x-text="`${employee.firstName || ''} ${employee.lastName || ''}`.trim() || 'Unnamed employee'"></div>
                  <div class="employee-sub" x-text="employee.role || 'Role unavailable'"></div>
                  <div class="employee-sub" x-text="employee.status"></div>
                </div>
              </div>
            </th>
            <template x-for="req in requirements" :key="req.id">
              <td>
                <button
                  type="button"
                  class="cell"
                  @click="openEditor(employee.id, req.id, $event)"
                  :aria-label="`Edit ${req.name} for ${employee.firstName || ''} ${employee.lastName || ''}`"
                >
                  <span class="cell-status" :class="statusBadgeClass(employee.id, req.id)" x-text="cellStatusLabel(employee.id, req.id)"></span>
                  <span class="cell-sub" x-text="cellSubtext(employee.id, req.id)"></span>
                  <span class="cell-indicator" x-show="isRequirementExpiring(getEmployeeRequirement(employee.id, req.id))"></span>
                </button>
              </td>
            </template>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
