<div id="bulk-actions" class="bulk-actions-slot" x-html="partials.bulkActions"></div>
<div class="grid-container">
  <template x-if="loading">
    <div class="p-6 space-y-3">
      <div class="h-6 w-1/3 bg-slate-200 animate-pulse rounded"></div>
      <div class="h-48 bg-slate-100 animate-pulse rounded-xl"></div>
    </div>
  </template>

  <template x-if="!loading && filteredEmployees.length===0">
    <div class="card p-8 text-center">
      <h3 class="text-lg font-semibold">No matches</h3>
      <p class="text-slate-500 mt-1">Try adjusting filters or import employees.</p>
      <div class="mt-4 flex justify-center gap-2">
        <button class="btn btn-primary" @click="openImportDrawer()">Open Import</button>
        <button class="btn" @click="downloadSampleCSV()">Download Sample CSV</button>
      </div>
    </div>
  </template>

  <div class="grid-scroll" role="region" aria-label="Scrollable requirements table" x-show="!loading && filteredEmployees.length">
    <table class="requirements-table has-selection-column">
      <thead>
        <tr>
          <th scope="col" class="sticky-select sticky-header checkbox-cell">
            <span class="sr-only">Select all employees</span>
            <input
              type="checkbox"
              class="checkbox-input"
              x-ref="selectAllCheckbox"
              :checked="areAllVisibleSelected()"
              @change="toggleSelectAll($event.target.checked)"
              aria-label="Select all filtered employees"
              x-effect="if ($refs.selectAllCheckbox) { $refs.selectAllCheckbox.indeterminate = hasSomeVisibleSelected() && !areAllVisibleSelected(); }"
            />
          </th>
          <th scope="col" class="sticky-col sticky-header">
            <span>Employee</span>
          </th>
          <template x-for="req in requirements" :key="req.id">
            <th scope="col" class="sticky-header">
              <div class="requirement-head">
                <span class="requirement-name" x-text="req.name"></span>
                <span class="requirement-tag" x-show="req.defaultExpiryDays" x-text="req.defaultExpiryDays + 'd'"></span>
              </div>
            </th>
          </template>
        </tr>
      </thead>
      <tbody>
        <template x-for="employee in filteredEmployees" :key="employee.id">
          <tr :class="{ 'row-selected': isEmployeeSelected(employee.id) }">
            <td class="sticky-select checkbox-cell">
              <input
                type="checkbox"
                class="checkbox-input"
                :aria-label="`Select ${employee.firstName || ''} ${employee.lastName || ''}`.trim() || 'Select employee'"
                :checked="isEmployeeSelected(employee.id)"
                @change="toggleEmployeeSelection(employee.id, $event.target.checked)"
              />
            </td>
            <th scope="row" class="sticky-col">
              <div class="flex items-center gap-3">
                <div class="relative">
                  <div
                    class="h-8 w-8 rounded-full bg-indigo-100 text-indigo-700 grid place-items-center text-xs font-semibold"
                    x-text="(employee.firstName?.[0]||'') + (employee.lastName?.[0]||'')"
                  ></div>
                  <svg viewBox="0 0 24 24" class="absolute -bottom-1 -right-1 h-5 w-5">
                    <circle cx="12" cy="12" r="10" stroke-width="3" fill="none" class="stroke-slate-200"></circle>
                    <circle
                      cx="12"
                      cy="12"
                      r="10"
                      stroke-width="3"
                      fill="none"
                      :style="`stroke-dasharray:${(employeeCompliancePercent(employee.id)/100)*62.83} 62.83;transition:stroke-dasharray .25s`"
                      :class="employeeCompliancePercent(employee.id)>=90?'stroke-emerald-500':employeeCompliancePercent(employee.id)>=70?'stroke-amber-500':'stroke-rose-500'"
                    ></circle>
                  </svg>
                </div>
                <div>
                  <div class="font-medium" x-text="employee.fullName || (employee.firstName+' '+employee.lastName)"></div>
                  <div class="text-xs text-slate-500" x-text="(employee.role||'—') + ' • ' + (employee.status||'—')"></div>
                </div>
                <button class="ml-auto text-slate-500 hover:text-slate-700" @click.stop="openProfile(employee.id)" title="Details">⋯</button>
              </div>
            </th>
            <template x-for="req in requirements" :key="req.id">
              <td x-data="{ cell: getRequirementCell(employee.id, req.id) }">
                <div
                  class="cell"
                  @click="openEditor($event, employee.id, req.id)"
                >
                  <span
                    class="badge"
                    :class="{
                      'badge-green': (cell.status==='Completed' || cell.status==='Complete') && !cellExpired(cell),
                      'badge-amber': (cell.status==='Completed' || cell.status==='Complete') && cellWarn(cell),
                      'badge-rose':  cellExpired(cell),
                      'badge-slate': (cell.status!=='Completed' && cell.status!=='Complete') && !cellExpired(cell)
                    }"
                    x-text="chipText(cell)"
                    role="button"
                    tabindex="0"
                    :aria-label="`Edit ${req.name} for ${employee.firstName || ''} ${employee.lastName || ''}`.trim() || 'Edit requirement'"
                    @click.stop="openEditor($event, employee.id, req.id)"
                    @keydown.enter.prevent="openEditor($event, employee.id, req.id)"
                    @keydown.space.prevent="openEditor($event, employee.id, req.id)"
                  ></span>
                  <span class="cell-sub" x-text="cellSubtext(cell)"></span>
                </div>
              </td>
            </template>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
