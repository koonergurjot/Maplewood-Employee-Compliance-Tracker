<style>
  .mapping-table {
    border-collapse: separate;
    border-spacing: 0;
  }

  .mapping-table thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background-color: inherit;
  }

  .mapping-table tbody tr:nth-child(odd) {
    background: rgba(0, 0, 0, 0.02);
  }

  .dark .mapping-table tbody tr:nth-child(odd) {
    background: rgba(148, 163, 184, 0.1);
  }

  .mapping-table td:first-child,
  .mapping-table th:first-child {
    position: sticky;
    left: 0;
    z-index: 3;
    background-color: inherit;
  }
</style>
<div
  id="import-drawer-root"
  x-cloak
  class="fixed inset-0 z-50 flex pointer-events-none"
  :class="{ 'aria-hidden': !$store.app.overlay || $store.app.overlay.current !== 'import' }"
  :aria-hidden="!$store.app.overlay || $store.app.overlay.current !== 'import'"
>
  <div
    x-cloak
    x-show="importDrawer.open"
    x-transition.opacity.duration.150ms
    class="fixed inset-0 bg-black/40 pointer-events-auto"
    style="z-index: 55"
  ></div>
  <section
    x-cloak
    x-show="importDrawer.open"
    class="fixed right-0 top-0 flex h-full w-[36rem] flex-col overflow-y-auto bg-white shadow-2xl pointer-events-auto transition-transform duration-200 ease-out dark:bg-slate-900"
    style="z-index: 60"
    x-transition:enter="transform transition ease-out duration-200"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transform transition ease-in duration-150"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    role="dialog"
    aria-modal="true"
    aria-labelledby="import-drawer-title"
    @click.outside="closeImportDrawer()"
    @keydown.escape.window.stop="closeImportDrawer()"
  >
    <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 px-6 py-5 backdrop-blur dark:border-slate-700 dark:bg-slate-900/95">
      <div class="flex items-center justify-between gap-4">
        <button type="button" class="btn-back" @click="goBack()">
          ← <span>Back</span>
        </button>
        <div class="flex items-center gap-3">
          <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-50">Import employees</h2>
          <button
            type="button"
            class="rounded-full p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
            @click="closeImportDrawer()"
            aria-label="Close"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
    <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-5 dark:border-slate-700">
      <div>
        <h2 id="import-drawer-title" class="text-lg font-semibold text-slate-900 dark:text-slate-50">Import employees</h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
          Upload a CSV export to preview changes before committing them.
        </p>
      </div>
      <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
        Upload a CSV export to preview changes before committing them.
      </p>
    </header>
    <div class="flex-1 overflow-y-auto px-6 py-6">
      <div class="space-y-6">
        <div class="space-y-2">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Import mode</span>
          <div
            class="inline-flex rounded-lg bg-slate-100 p-1 text-sm font-medium text-slate-600 shadow-sm dark:bg-slate-800/70 dark:text-slate-300"
            role="tablist"
            tabindex="0"
          >
            <button
              type="button"
              role="tab"
              :aria-selected="importDrawer.mode === 'employees'"
              :tabindex="importDrawer.mode === 'employees' ? 0 : -1"
              class="rounded-md px-3 py-1.5 transition"
              :class="
                importDrawer.mode === 'employees'
                  ? 'bg-white text-slate-900 shadow ring-1 ring-slate-200 dark:bg-slate-900 dark:text-slate-100 dark:ring-slate-700'
                  : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'
              "
              @click="setImportDrawerMode('employees')"
            >
              Employees
            </button>
            <button
              type="button"
              role="tab"
              :aria-selected="importDrawer.mode === 'seniority'"
              :tabindex="importDrawer.mode === 'seniority' ? 0 : -1"
              class="rounded-md px-3 py-1.5 transition"
              :class="
                importDrawer.mode === 'seniority'
                  ? 'bg-white text-slate-900 shadow ring-1 ring-slate-200 dark:bg-slate-900 dark:text-slate-100 dark:ring-slate-700'
                  : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'
              "
              @click="setImportDrawerMode('seniority')"
            >
              Seniority
            </button>
          </div>
        </div>

        <div class="space-y-3">
          <label
            class="block text-sm font-medium text-slate-700 dark:text-slate-200"
            for="import-file-input"
            x-text="importDrawer.mode === 'seniority' ? 'Seniority file' : 'Employee file'"
          ></label>
          <input
            id="import-file-input"
            x-ref="importFileInput"
            type="file"
            :accept="importDrawer.mode === 'seniority' ? '.csv,.xlsx' : '.csv,.json'"
            class="block w-full cursor-pointer rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm text-slate-700 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/60 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200"
            @change="onImportFileChange($event)"
            data-autofocus
          />
          <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
            <span
              x-text="
                importDrawer.fileName
                  || (importDrawer.mode === 'seniority'
                    ? 'CSV or XLSX files are supported.'
                    : 'CSV files are recommended.')
              "
            ></span>
            <button
              type="button"
              class="text-blue-600 hover:underline dark:text-blue-400"
              @click="downloadSampleCSV()"
            >
              <span x-text="importDrawer.mode === 'seniority' ? 'Download Seniority Sample' : 'Download Sample CSV'"></span>
            </button>
          </div>
        </div>

        <template x-if="importDrawer.error">
          <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900/60 dark:bg-red-900/30 dark:text-red-200" role="alert">
            <span x-text="importDrawer.error"></span>
          </div>
        </template>

        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            class="btn"
            :disabled="!importDrawer.file || importDrawer.dryRunLoading"
            @click="runImportDryRun()"
          >
            <template x-if="importDrawer.dryRunLoading">
              <span>Running…</span>
            </template>
            <template x-if="!importDrawer.dryRunLoading">
              <span>Dry-run</span>
            </template>
          </button>
          <button
            type="button"
            class="btn"
            x-cloak
            x-show="cloudAvailable"
            :disabled="importDrawer.submitDisabled"
            @click="submitImportForCloudApproval()"
          >
            <template x-if="importDrawer.submitLoading">
              <span>Submitting…</span>
            </template>
            <template x-if="!importDrawer.submitLoading">
              <span x-text="importDrawer.awaitingApproval ? 'Submitted' : 'Submit for approval'"></span>
            </template>
          </button>
          <button
            type="button"
            class="btn"
            :disabled="importDrawer.commitDisabled"
            @click="commitImport()"
          >
            <template x-if="importDrawer.commitLoading">
              <span>Committing…</span>
            </template>
            <template x-if="!importDrawer.commitLoading">
              <span>Commit</span>
            </template>
          </button>
        </div>

        <template x-if="cloudAvailable && importDrawer.awaitingApproval">
          <div class="flex items-center gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800 dark:border-amber-500/40 dark:bg-amber-900/30 dark:text-amber-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-11.5a.75.75 0 00-1.5 0v4.25c0 .414.336.75.75.75h3a.75.75 0 000-1.5H10.75V6.5z" clip-rule="evenodd" />
            </svg>
            <div>
              <p class="font-medium">Awaiting approval</p>
              <template x-if="importDrawer.pendingBatchId">
                <p class="text-xs text-amber-700 dark:text-amber-300">
                  Batch <span x-text="importDrawer.pendingBatchId"></span>
                </p>
              </template>
            </div>
          </div>
        </template>

        <template
          x-if="
            importDrawer.mode === 'seniority'
              && (importDrawer.mappingRows.length || importDrawer.headerRowNumber)
          "
        >
          <section class="rounded-xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-800/50">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Detected columns</h3>
              <template x-if="importDrawer.headerRowNumber">
                <p class="text-xs text-slate-500 dark:text-slate-400">
                  Detected header row
                  <span class="font-semibold text-slate-700 dark:text-slate-200" x-text="importDrawer.headerRowNumber"></span>
                </p>
              </template>
            </div>
            <template x-if="importDrawer.mappingRows.length">
              <div class="mt-3 overflow-hidden rounded-lg border border-slate-200 shadow-sm dark:border-slate-700">
                <table class="min-w-full divide-y divide-slate-200 text-sm dark:divide-slate-700">
                  <thead class="bg-slate-100 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:bg-slate-800/60 dark:text-slate-300">
                    <tr>
                      <th scope="col" class="px-3 py-2 text-left">Source Column</th>
                      <th scope="col" class="w-10 px-1 text-center" aria-hidden="true">→</th>
                      <th scope="col" class="px-3 py-2 text-left">Mapped Field</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                    <template x-for="(row, index) in importDrawer.mappingRows" :key="row.key || index">
                      <tr class="odd:bg-white even:bg-slate-50 dark:odd:bg-slate-900 dark:even:bg-slate-800/60">
                        <td class="px-3 py-2 text-slate-700 dark:text-slate-200" x-text="row.sourceHeader"></td>
                        <td class="px-1 text-center text-slate-400 dark:text-slate-500" aria-hidden="true">→</td>
                        <td class="px-3 py-2 text-slate-700 dark:text-slate-200" x-text="row.mappedField"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <template x-if="!importDrawer.mappingRows.length">
              <p class="mt-3 text-sm text-slate-500 dark:text-slate-400">
                No column mappings detected.
              </p>
            </template>
          </section>
        </template>

        <template
          x-if="
            importDrawer.mode !== 'seniority'
              && importDrawer.mapping
              && Object.keys(importDrawer.mapping).length
          "
        >
          <section class="rounded-xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-800/50">
            <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Detected column mapping</h3>
            <dl class="mt-3 grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">
              <template x-for="(column, key) in importDrawer.mapping" :key="key">
                <div class="rounded-lg bg-white p-3 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700">
                  <dt class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400" x-text="key"></dt>
                  <dd class="mt-1 font-medium text-slate-800 dark:text-slate-100" x-text="column || '—'"></dd>
                </div>
              </template>
            </dl>
          </section>
        </template>

        <template x-if="importDrawer.mode === 'seniority' && importDrawer.summary">
          <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Dry-run summary</h3>
            </div>
            <dl class="mt-3 grid grid-cols-1 gap-3 text-sm sm:grid-cols-3">
              <div class="rounded-lg bg-blue-50 p-3 text-center shadow-sm ring-1 ring-blue-200 dark:bg-blue-900/40 dark:ring-blue-800/80">
                <dt class="text-xs uppercase tracking-wide text-blue-700 dark:text-blue-200">Added</dt>
                <dd class="mt-1 text-2xl font-semibold text-blue-700 dark:text-blue-200" x-text="importDrawer.summary.added ?? 0"></dd>
              </div>
              <div class="rounded-lg bg-emerald-50 p-3 text-center shadow-sm ring-1 ring-emerald-200 dark:bg-emerald-900/40 dark:ring-emerald-800/80">
                <dt class="text-xs uppercase tracking-wide text-emerald-700 dark:text-emerald-200">Updated</dt>
                <dd class="mt-1 text-2xl font-semibold text-emerald-700 dark:text-emerald-200" x-text="importDrawer.summary.updated ?? 0"></dd>
              </div>
              <div class="rounded-lg bg-amber-50 p-3 text-center shadow-sm ring-1 ring-amber-200 dark:bg-amber-900/40 dark:ring-amber-800/80">
                <dt class="text-xs uppercase tracking-wide text-amber-700 dark:text-amber-200">Skipped</dt>
                <dd class="mt-1 text-2xl font-semibold text-amber-700 dark:text-amber-200" x-text="importDrawer.summary.skipped ?? 0"></dd>
              </div>
            </dl>
          </section>
        </template>

        <template x-if="cloudAvailable">
          <div class="space-y-3">
            <button
              type="button"
              class="btn ghost"
              @click="toggleImportAdminMode()"
            >
              <span x-text="importDrawer.adminMode ? 'Hide admin approvals' : 'Admin approvals'"></span>
            </button>
            <template x-if="importDrawer.adminMode">
              <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Pending approvals</h3>
                  <button
                    type="button"
                    class="btn ghost"
                    :disabled="importDrawer.pendingImportsLoading"
                    @click="loadPendingImports()"
                  >
                    <template x-if="importDrawer.pendingImportsLoading">
                      <span>Refreshing…</span>
                    </template>
                    <template x-if="!importDrawer.pendingImportsLoading">
                      <span>Refresh</span>
                    </template>
                  </button>
                </div>
                <template x-if="importDrawer.pendingImportsError">
                  <p class="mt-3 text-sm text-red-600 dark:text-red-300" x-text="importDrawer.pendingImportsError"></p>
                </template>
                <template x-if="!importDrawer.pendingImportsError && !importDrawer.pendingImports.length">
                  <p class="mt-3 text-sm text-slate-500 dark:text-slate-400">No pending imports.</p>
                </template>
                <ul class="mt-3 space-y-3" x-show="importDrawer.pendingImports.length">
                  <template x-for="batch in importDrawer.pendingImports" :key="batch.id">
                    <li class="rounded-lg border border-slate-200 bg-white p-3 shadow-sm dark:border-slate-700 dark:bg-slate-900">
                      <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
                        <div>
                          <p class="text-sm font-semibold text-slate-800 dark:text-slate-100" x-text="batch.summaryText"></p>
                          <p class="text-xs text-slate-500 dark:text-slate-400">
                            Submitted
                            <span x-text="batch.createdAtLabel || 'Recently'"></span>
                            <template x-if="batch.requestedBy">
                              <span>
                                • by <span x-text="batch.requestedBy"></span>
                              </span>
                            </template>
                          </p>
                        </div>
                        <button
                          type="button"
                          class="btn"
                          :disabled="importDrawer.approvingBatchId === batch.id"
                          @click="approvePendingImport(batch.id)"
                        >
                          <template x-if="importDrawer.approvingBatchId === batch.id">
                            <span>Approving…</span>
                          </template>
                          <template x-if="importDrawer.approvingBatchId !== batch.id">
                            <span>Approve</span>
                          </template>
                        </button>
                      </div>
                      <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">
                        Mode: <span class="font-medium" x-text="batch.mode"></span>
                        <template x-if="batch.fileName">
                          <span> • <span x-text="batch.fileName"></span></span>
                        </template>
                        <span> • Rows: <span x-text="batch.rowCount"></span></span>
                      </p>
                    </li>
                  </template>
                </ul>
              </section>
            </template>
          </div>
        </template>

        <template
          x-if="
            importDrawer.mode !== 'seniority'
              && importDrawer.summary
          "
        >
          <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
            <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Dry-run summary</h3>
            <table class="mt-3 w-full table-fixed border-separate border-spacing-y-2 text-sm">
              <thead>
                <tr class="text-left text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">
                  <th scope="col" class="w-1/3">Added</th>
                  <th scope="col" class="w-1/3">Updated</th>
                  <th scope="col" class="w-1/3">Skipped</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="rounded-lg bg-blue-50 px-3 py-2 font-semibold text-blue-700 dark:bg-blue-900/40 dark:text-blue-200" x-text="importDrawer.summary.added ?? 0"></td>
                  <td class="rounded-lg bg-emerald-50 px-3 py-2 font-semibold text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-200" x-text="importDrawer.summary.updated ?? 0"></td>
                  <td class="rounded-lg bg-amber-50 px-3 py-2 font-semibold text-amber-700 dark:bg-amber-900/40 dark:text-amber-200" x-text="importDrawer.summary.skipped ?? 0"></td>
                </tr>
              </tbody>
            </table>
          </section>
        </template>

        <template x-if="importDrawer.previewColumns.length">
          <section>
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Preview</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400" x-text="`Showing ${importDrawer.previewRows.length} of ${importDrawer.previewTotal}`"></p>
            </div>
            <div class="mt-3 overflow-hidden rounded-xl border border-slate-200 shadow-sm dark:border-slate-700">
              <div class="max-h-64 overflow-auto">
                <table class="mapping-table min-w-full divide-y divide-slate-200 text-sm dark:divide-slate-700">
                  <thead class="bg-slate-50 dark:bg-slate-800/60">
                    <tr>
                      <template x-for="column in importDrawer.previewColumns" :key="column">
                        <th scope="col" class="whitespace-nowrap px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-300" x-text="column"></th>
                      </template>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                    <template x-for="(row, rowIndex) in importDrawer.previewRows" :key="rowIndex">
                      <tr class="bg-white dark:bg-slate-900">
                        <template x-for="column in importDrawer.previewColumns" :key="`${rowIndex}-${column}`">
                          <td class="whitespace-nowrap px-3 py-2 text-slate-700 dark:text-slate-200" x-data="{ cell: row[column] }">
                            <template x-if="cell && typeof cell === 'object'">
                              <div class="flex items-center gap-2">
                                <span x-text="cell.text ?? ''"></span>
                                <template x-if="cell.badge">
                                  <span
                                    class="inline-flex items-center rounded-full bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-700 dark:bg-amber-900/40 dark:text-amber-200"
                                    x-text="cell.badge"
                                    :title="cell.title || ''"
                                  ></span>
                                </template>
                              </div>
                            </template>
                            <template x-if="!cell || typeof cell !== 'object'">
                              <span x-text="cell ?? ''"></span>
                            </template>
                          </td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </template>
      </div>
    </div>
  </section>
</div>
