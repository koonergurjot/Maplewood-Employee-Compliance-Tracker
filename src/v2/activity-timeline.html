<section
  x-data="activityTimeline()"
  x-init="init(); return () => destroy()"
  class="p-4 overflow-y-auto"
>
  <h2 class="text-lg font-semibold mb-3">Activity Timeline</h2>

  <template x-if="error">
    <p class="text-sm text-red-600 dark:text-red-300" x-text="error"></p>
  </template>

  <template x-if="!error && loading">
    <p class="text-slate-400 text-sm italic">Loading activity…</p>
  </template>

  <template x-if="!error && !loading && !entries.length">
    <p class="text-slate-400 text-sm italic">No activity yet.</p>
  </template>

  <template x-for="entry in entries" :key="entry.id">
    <div class="border-l-2 border-indigo-500 pl-3 mb-2">
      <div class="text-sm text-slate-700 dark:text-slate-200" x-text="entry.summary"></div>
      <div class="text-xs text-slate-400 dark:text-slate-500" x-text="new Date(entry.createdAt).toLocaleString()"></div>
    </div>
  </template>
</section>
