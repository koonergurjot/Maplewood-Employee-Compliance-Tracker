<section x-data="{ logs: activityLog }" class="p-4 overflow-y-auto">
  <h2 class="text-lg font-semibold mb-3">Activity Timeline</h2>
  <template x-for="a in logs" :key="a.createdAt">
    <div class="border-l-2 border-indigo-500 pl-3 mb-2">
      <div class="text-sm text-slate-700" x-text="a.summary"></div>
      <div class="text-xs text-slate-400" x-text="new Date(a.createdAt).toLocaleString()"></div>
    </div>
  </template>
  <template x-if="!logs.length">
    <p class="text-slate-400 text-sm italic">No activity yet.</p>
  </template>
</section>
