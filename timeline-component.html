<div x-data="timeline()" x-init="init()">
  <template x-for="entry in entries" :key="entry.id">
    <div class="flex items-center space-x-2">
      <span x-text="new Date(entry.timestamp).toLocaleString()"></span>
      <span x-text="entry.actionType"></span>
      <button x-show="entry.status === 'completed'" @click="undo(entry)">Undo</button>
    </div>
  </template>
</div>

<script type="module" nonce="bWFwbGV3b29k">
import Dexie from 'dexie';
import ActivityLog from './activity-log.js';
import {
  UpdateEmployee,
  ImportEmployees,
  BulkUpdateStatus
} from './commands.js';

export function timeline() {
  return {
    db: null,
    activityLog: null,
    entries: [],

    async init() {
      // Example schema—extend with your real tables.
      this.db = new Dexie('ComplianceMatrixDB');
      this.db.version(1).stores({
        employees: 'id',
        employeeRequirements: '[employeeId+requirementId],employeeId,requirementId,status',
        activityLog: 'id,timestamp,actionType'
      });
      await this.db.open();
      this.activityLog = await ActivityLog.init(this.db);
      this.entries = await this.activityLog.recent();
    },

    async undo(entry) {
      const factories = {
        UpdateEmployee: e =>
          new UpdateEmployee(this.db, {
            employeeId: e.targets[0],
            newData: e.metadata.newData
          }),
        ImportEmployees: e =>
          new ImportEmployees(this.db, {
            employees: e.metadata.employees
          }),
        BulkUpdateStatus: e =>
          new BulkUpdateStatus(this.db, {
            employeeIds: e.targets,
            requirementIds: e.metadata.requirementIds,
            status: e.metadata.status,
            completedOn: e.metadata.completedOn ?? null,
            expiresOn: e.metadata.expiresOn ?? null
          })
      };
      const factory = factories[entry.actionType];
      if (!factory) return;
      await this.activityLog.undo(entry.id, factory);
      this.entries = await this.activityLog.recent();
    }
  };
}

/* ------------------------------------------------------------------
   Example hooks showing how app actions integrate with ActivityLog.
   Replace with actual UI handlers in your application.
------------------------------------------------------------------ */

export async function updateEmployee(db, activityLog, employeeId, newData, actor) {
  const cmd = new UpdateEmployee(db, { employeeId, newData });
  const undoPayload = await cmd.execute();
  await activityLog.record({
    actionType: 'UpdateEmployee',
    actor,
    targets: [employeeId],
    metadata: { newData },
    undoPayload
  });
}

export async function importEmployees(db, activityLog, employees, actor) {
  const cmd = new ImportEmployees(db, { employees });
  const undoPayload = await cmd.execute();
  await activityLog.record({
    actionType: 'ImportEmployees',
    actor,
    targets: [],
    metadata: { employees },
    undoPayload
  });
}

export async function bulkUpdateStatus(
  db,
  activityLog,
  employeeIds,
  requirementIds,
  status,
  actor,
  { completedOn = null, expiresOn = null } = {}
) {
  const cmd = new BulkUpdateStatus(db, {
    employeeIds,
    requirementIds,
    status,
    completedOn,
    expiresOn
  });
  const undoPayload = await cmd.execute();
  await activityLog.record({
    actionType: 'BulkUpdateStatus',
    actor,
    targets: employeeIds,
    metadata: {
      requirementIds,
      status,
      completedOn,
      expiresOn
    },
    undoPayload
  });
}
</script>
