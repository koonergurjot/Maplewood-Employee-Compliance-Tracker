<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maplewood Compliance Dashboard</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="icon-192.svg" />
  <link rel="apple-touch-icon" href="icon-512.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-surface: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-dark: #0f172a;
      --text-primary: #0f172a;
      --text-primary-dark: #f8fafc;
      --text-muted: #64748b;
      --border-soft: rgba(15, 23, 42, 0.12);
      --border-soft-dark: rgba(148, 163, 184, 0.25);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --danger: #ef4444;
      --warn: #f59e0b;
      --success: #10b981;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    body.dark {
      background: #020617;
      color: var(--text-primary-dark);
    }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="dashboardApp" x-init="init()" x-cloak :class="{ dark: darkMode }">
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
    <header class="space-y-2">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold leading-tight">Employee Compliance Overview</h1>
          <p class="text-sm text-muted">Use filters to narrow results and click any requirement cell to update progress.</p>
        </div>
        <button type="button" class="btn" @click="toggleDarkMode" aria-label="Toggle dark mode">
          <span x-text="darkMode ? 'Light mode' : 'Dark mode'"></span>
        </button>
      </div>
      <div class="text-xs text-muted">Showing <span x-text="filteredEmployees.length"></span> of <span x-text="employees.length"></span> team members.</div>
    </header>

    <template x-if="loadError">
      <section class="card" role="alert">
        <div class="space-y-2" style="padding:1.25rem 1.5rem;">
          <h2 class="text-lg font-semibold">Unable to load data</h2>
          <p class="text-sm text-muted" x-text="loadError"></p>
        </div>
      </section>
    </template>

    <section class="card" aria-label="Employee requirements grid">
      <div x-ref="gridHost"></div>
    </section>
  </main>

  <template id="requirements-grid-template"></template>
  <template id="inline-edit-template"></template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
