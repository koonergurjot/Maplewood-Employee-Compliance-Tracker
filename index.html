<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maplewood Compliance Dashboard</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="icon-192.svg" />
  <link rel="apple-touch-icon" href="icon-512.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-surface: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-dark: #0f172a;
      --text-primary: #0f172a;
      --text-primary-dark: #f8fafc;
      --text-muted: #64748b;
      --border-soft: rgba(15, 23, 42, 0.12);
      --border-soft-dark: rgba(148, 163, 184, 0.25);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --danger: #ef4444;
      --warn: #f59e0b;
      --success: #10b981;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    body.dark {
      background: #020617;
      color: var(--text-primary-dark);
    }

    [x-cloak] { display: none !important; }

    .export-menu {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-soft);
      border-radius: 0.75rem;
      padding: 0.25rem;
      box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.08);
    }

    body.dark .export-menu {
      background: var(--bg-card-dark);
      color: var(--text-primary-dark);
      border-color: var(--border-soft-dark);
    }

    .export-menu button {
      width: 100%;
      display: block;
      background: none;
      border: none;
      padding: 0.5rem 0.75rem;
      text-align: left;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: inherit;
      cursor: pointer;
    }

    .export-menu button:hover,
    .export-menu button:focus {
      background: var(--accent-soft);
      outline: none;
    }
  </style>
</head>
<body x-data="AppStore()" data-app="compliance-tracker">
  <div
    id="app-v2"
    x-show="APP_FLAGS.USE_V2_MAIN"
    x-data="v2DashboardApp"
    x-init="init()"
    x-cloak
    :class="{ dark: darkMode }"
    x-effect="document.body.classList.toggle('dark', darkMode)"
  >
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
      <header class="space-y-2">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <h1 class="text-2xl font-semibold leading-tight">Employee Compliance Overview</h1>
            <p class="text-sm text-muted">Use filters to narrow results and click any requirement cell to update progress.</p>
          </div>
          <div class="flex flex-wrap items-center justify-end gap-2">
            <button type="button" class="btn ghost" @click="openImportDrawer">Import</button>
            <button type="button" class="btn ghost" @click="$store.app.showAddEmployeeModal = true">Add Employee</button>
            <div class="relative" @click.outside="showExportMenu = false">
              <button type="button" class="btn ghost" @click="showExportMenu = !showExportMenu">Export</button>
              <div
                class="export-menu"
                x-show="showExportMenu"
                x-transition.opacity
                style="min-width: 10rem; position: absolute; right: 0; margin-top: 0.5rem;"
              >
                <button type="button" @click="triggerExport('csv')">Export CSV</button>
                <button type="button" @click="triggerExport('json')">Export JSON</button>
                <button type="button" @click="printReport">Print</button>
              </div>
            </div>
            <button type="button" class="btn" @click="toggleDarkMode" aria-label="Toggle dark mode">
              <span x-text="darkMode ? 'Light mode' : 'Dark mode'"></span>
            </button>
          </div>
        </div>
        <div class="text-xs text-muted">Showing <span x-text="$store.app.filteredCount()"></span> of <span x-text="$store.app.totalEmployees()"></span> team members.</div>
      </header>

      <template x-if="loadError">
        <section class="card" role="alert">
          <div class="space-y-2" style="padding:1.25rem 1.5rem;">
            <h2 class="text-lg font-semibold">Unable to load data</h2>
            <p class="text-sm text-muted" x-text="loadError"></p>
          </div>
        </section>
      </template>

      <section class="card" aria-label="Employee requirements grid">
        <div class="space-y-4">
          <section class="filters-card">
            <div class="filters-grid">
              <label class="filter-field" aria-label="Filter by role">
                <span class="filter-label">Role</span>
                <select multiple size="4" class="input" x-model="filters.roles" @change="applyFilters">
                  <template x-if="!roleOptions.length">
                    <option disabled value="">No roles available</option>
                  </template>
                  <template x-for="role in roleOptions" :key="role">
                    <option :value="role" x-text="role"></option>
                  </template>
                </select>
              </label>
              <label class="filter-field" aria-label="Filter by employee status">
                <span class="filter-label">Status</span>
                <select class="input" x-model="filters.status" @change="applyFilters">
                  <template x-for="option in statusOptions" :key="option.value">
                    <option :value="option.value" x-text="option.label"></option>
                  </template>
                </select>
              </label>
              <label class="filter-field" aria-label="Filter by compliance percentage">
                <span class="filter-label">Compliance %</span>
                <select class="input" x-model="filters.compliance" @change="applyFilters">
                  <template x-for="option in complianceOptions" :key="option.value">
                    <option :value="option.value" x-text="option.label"></option>
                  </template>
                </select>
              </label>
              <label class="filter-field" aria-label="Filter by expiration window">
                <span class="filter-label">Expiring soon</span>
                <div class="toggle-row">
                  <input id="expiring-toggle" type="checkbox" class="toggle" x-model="filters.expiringSoon" @change="applyFilters" />
                  <label class="toggle-label" for="expiring-toggle">Within 30 days</label>
                </div>
              </label>
              <label class="filter-field filter-wide" aria-label="Search employees">
                <span class="filter-label">Search</span>
                <input type="search" class="input" placeholder="Search by name" x-model="filters.search" @input.debounce.200ms="applyFilters" />
              </label>
            </div>
            <div class="filters-footer">
              <button type="button" class="btn ghost" @click="resetFilters">Reset filters</button>
              <div class="filters-meta" x-show="filters.roles.length || filters.status !== 'all' || filters.compliance !== 'all' || filters.expiringSoon || filters.search">
                <span class="text-muted">Filters active</span>
              </div>
            </div>
          </section>

          <div id="requirements-grid" x-html="partials.requirementsGrid"></div>
        </div>
      </section>
    </main>

    <div id="import-drawer" x-html="partials.importDrawer"></div>
    <div id="add-employee-modal" x-html="partials.addEmployeeModal"></div>

    <template id="inline-edit-template"></template>
  </div>

  <div id="app-legacy" x-show="!APP_FLAGS.USE_V2_MAIN"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
