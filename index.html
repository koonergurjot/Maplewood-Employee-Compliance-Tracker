<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maplewood Compliance Dashboard</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="icon-192.svg" />
  <link rel="apple-touch-icon" href="icon-512.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="/src/styles/print.css" media="print" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-surface: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-dark: #0f172a;
      --text-primary: #0f172a;
      --text-primary-dark: #f8fafc;
      --text-muted: #64748b;
      --border-soft: rgba(15, 23, 42, 0.12);
      --border-soft-dark: rgba(148, 163, 184, 0.25);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --danger: #ef4444;
      --warn: #f59e0b;
      --success: #10b981;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    body.dark {
      background: #020617;
      color: var(--text-primary-dark);
    }

    [x-cloak] { display: none !important; }

    .export-menu {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-soft);
      border-radius: 0.75rem;
      padding: 0.25rem;
      box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.08);
    }

    body.dark .export-menu {
      background: var(--bg-card-dark);
      color: var(--text-primary-dark);
      border-color: var(--border-soft-dark);
    }

    .export-menu button {
      width: 100%;
      display: block;
      background: none;
      border: none;
      padding: 0.5rem 0.75rem;
      text-align: left;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: inherit;
      cursor: pointer;
    }

    .export-menu button:hover,
    .export-menu button:focus {
      background: var(--accent-soft);
      outline: none;
    }

    .debug-hitbox-toggle {
      position: fixed;
      inset: auto 1.5rem 1.5rem auto;
      z-index: 2000;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      border-radius: 9999px;
      padding: 0.5rem 0.875rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .debug-hitbox-toggle:hover,
    .debug-hitbox-toggle:focus-visible {
      background: rgba(37, 99, 235, 0.9);
      transform: translateY(-1px);
      outline: none;
    }

    body.debug-hitboxes .debug-hitbox-toggle {
      background: rgba(239, 68, 68, 0.92);
    }

    body.debug-hitboxes .debug-hitbox-toggle:hover,
    body.debug-hitboxes .debug-hitbox-toggle:focus-visible {
      background: rgba(239, 68, 68, 1);
    }

    body.debug-hitboxes * {
      outline: 1px dashed rgba(37, 99, 235, 0.45);
      outline-offset: -1px;
    }

    body.debug-hitboxes *:hover {
      outline: 2px solid rgba(37, 99, 235, 0.85);
      outline-offset: -2px;
    }

    body.debug-hitboxes .debug-hitbox-toggle,
    body.debug-hitboxes .debug-hitbox-toggle * {
      outline: none !important;
    }

    body.debug-hitboxes [data-hitbox-blocker] {
      position: relative;
      outline: 3px solid rgba(239, 68, 68, 0.85) !important;
      background-image: repeating-linear-gradient(
        135deg,
        rgba(239, 68, 68, 0.12),
        rgba(239, 68, 68, 0.12) 10px,
        rgba(239, 68, 68, 0.05) 10px,
        rgba(239, 68, 68, 0.05) 20px
      );
    }

    body.debug-hitboxes [data-hitbox-blocker]::after {
      content: 'Blocker ' attr(data-hitbox-blocker);
      position: absolute;
      top: 0;
      left: 0;
      padding: 0.25rem 0.5rem;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(239, 68, 68, 0.95);
      border-bottom-right-radius: 0.5rem;
    }
  </style>
</head>
<body x-data="AppStore()" data-app="compliance-tracker">
  <div
    id="app-v2"
    x-show="APP_FLAGS.USE_V2_MAIN"
    x-data="v2DashboardApp"
    x-init="init()"
    x-cloak
    :class="{ dark: darkMode }"
    x-effect="document.body.classList.toggle('dark', darkMode)"
  >
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
      <header
        class="space-y-2 sticky top-0 z-30 bg-white/70 backdrop-blur border-b bg-[radial-gradient(1000px_200px_at_50%_-100px,rgba(99,102,241,.12),transparent)]"
      >
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <h1 class="text-2xl font-semibold leading-tight">Employee Compliance Overview</h1>
            <p class="text-sm text-muted">Use filters to narrow results and click any requirement cell to update progress.</p>
          </div>
          <div class="flex flex-wrap items-center justify-end gap-2">
            <button type="button" class="btn btn-primary" @click="openImportDrawer()">Import</button>
            <button type="button" class="btn" @click="openAddEmployee()">Add Employee</button>
            <button type="button" class="btn" @click="openAddRequirement()">+ Requirement</button>
            <div class="relative" x-data="{open:false}">
              <button type="button" class="btn" @click="open=!open">Export</button>
              <div
                x-show="open"
                x-cloak
                @click.outside="open=false"
                class="export-menu absolute right-0 mt-2 w-48 rounded-lg border bg-white shadow"
              >
                <button type="button" class="menu-item" @click="exportCSV(); open=false">Export CSV</button>
                <button type="button" class="menu-item" @click="exportJSON(); open=false">Export JSON</button>
                <button type="button" class="menu-item" @click="window.print(); open=false">Print view</button>
              </div>
            </div>
            <button type="button" class="btn" @click="window.print()">Print</button>
            <button type="button" class="btn" @click="toggleDarkMode" aria-label="Toggle dark mode">
              <span x-text="darkMode ? 'Light mode' : 'Dark mode'"></span>
            </button>
          </div>
        </div>
        <div class="text-xs text-muted">Showing <span x-text="$store.app.filteredCount()"></span> of <span x-text="$store.app.totalEmployees()"></span> team members.</div>
      </header>

      <template x-if="loadError">
        <section class="card" role="alert">
          <div class="space-y-2" style="padding:1.25rem 1.5rem;">
            <h2 class="text-lg font-semibold">Unable to load data</h2>
            <p class="text-sm text-muted" x-text="loadError"></p>
          </div>
        </section>
      </template>

      <div id="mini-analytics" x-show="!loadError" x-html="partials.miniAnalytics"></div>

      <section class="card" aria-label="Employee requirements grid">
        <div class="space-y-4">
          <div class="toolbar">
            <section class="filters-card">
              <div class="filters-grid">
                <label class="filter-field" aria-label="Filter by role">
                <span class="filter-label">Role</span>
                <select multiple size="4" class="input" x-model="filters.roles" @change="applyFilters">
                  <template x-if="!roleOptions.length">
                    <option disabled value="">No roles available</option>
                  </template>
                  <template x-for="role in roleOptions" :key="role">
                    <option :value="role" x-text="role"></option>
                  </template>
                </select>
              </label>
              <label class="filter-field" aria-label="Filter by employee status">
                <span class="filter-label">Status</span>
                <select class="input" x-model="filters.status" @change="applyFilters">
                  <template x-for="option in statusOptions" :key="option.value">
                    <option :value="option.value" x-text="option.label"></option>
                  </template>
                </select>
              </label>
              <label class="filter-field" aria-label="Filter by compliance percentage">
                <span class="filter-label">Compliance %</span>
                <select class="input" x-model="filters.compliance" @change="applyFilters">
                  <template x-for="option in complianceOptions" :key="option.value">
                    <option :value="option.value" x-text="option.label"></option>
                  </template>
                </select>
              </label>
              <label class="filter-field" aria-label="Filter by expiration window">
                <span class="filter-label">Expiring soon</span>
                <div class="toggle-row">
                  <input id="expiring-toggle" type="checkbox" class="toggle" x-model="filters.expiringSoon" @change="applyFilters" />
                  <label class="toggle-label" for="expiring-toggle">Within 30 days</label>
                </div>
              </label>
              <label class="filter-field filter-wide" aria-label="Search employees">
                <span class="filter-label">Search</span>
                <input type="search" class="input" placeholder="Search by name" x-model="filters.search" @input.debounce.200ms="applyFilters" />
              </label>
              </div>
              <div class="filters-footer">
                <button type="button" class="btn ghost" @click="resetFilters">Reset filters</button>
                <div class="filters-meta" x-show="filters.roles.length || filters.status !== 'all' || filters.compliance !== 'all' || filters.expiringSoon || filters.search || filters.analytics">
                  <span class="text-muted">Filters active</span>
                </div>
              </div>
            </section>
          </div>

          <div id="requirements-grid" x-html="partials.requirementsGrid"></div>
        </div>
      </section>

      <section class="card" aria-label="Recent activity">
        <div
          id="activity-timeline"
          x-html="partials.activityTimeline"
          class="activity-timeline"
        >
          <div class="space-y-3" style="padding:1.25rem 1.5rem;">
            <h2 class="text-lg font-semibold leading-tight">Recent activity</h2>
            <p class="text-sm text-muted">Updates you make will appear here.</p>
          </div>
        </div>
      </section>
    </main>

    <div id="import-drawer" x-html="partials.importDrawer"></div>
    <div id="add-requirement-modal" x-html="partials.addRequirementModal"></div>
    <div id="add-employee-modal" x-html="partials.addEmployeeModal"></div>

    <template id="inline-edit-template"></template>
  </div>

  <div id="app-legacy" x-show="!APP_FLAGS.USE_V2_MAIN"></div>

  <button
    type="button"
    class="debug-hitbox-toggle"
    x-data="{ active: false }"
    x-init="
      const sync = (event) => { active = !!(event.detail && event.detail.enabled); };
      document.addEventListener('debug-hitboxes:toggled', sync);
      active = document.body.classList.contains('debug-hitboxes');
    "
    @click="active = window.__debugHitboxes.toggle();"
    :aria-pressed="active.toString()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" width="16" height="16">
      <path
        d="M2.166 10.168a1 1 0 0 1 .002-.336c.19-1.052.76-2.05 1.698-2.988C5.51 5.2 7.614 4.25 10 4.25c2.386 0 4.49.95 6.134 2.594.938.938 1.508 1.936 1.698 2.988a1 1 0 0 1-.002.336c-.19 1.052-.76 2.05-1.698 2.988C14.49 14.8 12.386 15.75 10 15.75c-2.386 0-4.49-.95-6.134-2.594-.938-.938-1.508-1.936-1.698-2.988ZM10 6.25c-1.928 0-3.51.74-4.802 2.032a4.37 4.37 0 0 0-.934 1.718 4.37 4.37 0 0 0 .934 1.718C6.49 12.01 8.072 12.75 10 12.75c1.928 0 3.51-.74 4.802-2.032a4.37 4.37 0 0 0 .934-1.718 4.37 4.37 0 0 0-.934-1.718C13.51 6.99 11.928 6.25 10 6.25Zm0 1.75a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"
      />
    </svg>
    <span x-text="active ? 'Hide hitboxes' : 'Show hitboxes'"></span>
  </button>

  <script>
    (() => {
      const body = document.body;
      const blockerAttribute = 'data-hitbox-blocker';
      let raf = null;
      let enabled = false;

      const clearBlockers = () => {
        const active = body.querySelectorAll('[' + blockerAttribute + ']');
        active.forEach((el) => {
          el.removeAttribute(blockerAttribute);
        });
      };

      const annotateBlockers = () => {
        clearBlockers();
        if (!enabled) return;

        const viewportArea = window.innerWidth * window.innerHeight;
        if (!viewportArea) return;

        const elements = body.querySelectorAll('*');
        elements.forEach((el) => {
          if (!(el instanceof HTMLElement) || el === body) return;

          const style = window.getComputedStyle(el);
          if (
            style.pointerEvents === 'none' ||
            style.display === 'none' ||
            style.visibility === 'hidden' ||
            style.opacity === '0'
          ) {
            return;
          }

          const rect = el.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;

          const area = rect.width * rect.height;
          if (area < viewportArea * 0.6) return;
          if (rect.width < window.innerWidth * 0.6 || rect.height < window.innerHeight * 0.6) return;

          const coverage = Math.min(100, Math.round((area / viewportArea) * 100));
          el.setAttribute(blockerAttribute, coverage + '%');
        });
      };

      const scheduleAnnotate = () => {
        if (!enabled) return;
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          raf = null;
          annotateBlockers();
        });
      };

      const dispatchToggleEvent = () => {
        const event = new CustomEvent('debug-hitboxes:toggled', {
          detail: { enabled }
        });
        document.dispatchEvent(event);
      };

      const toggle = (force) => {
        const next = typeof force === 'boolean' ? force : !body.classList.contains('debug-hitboxes');
        enabled = next;
        body.classList.toggle('debug-hitboxes', enabled);
        if (!enabled) {
          clearBlockers();
        } else {
          annotateBlockers();
        }
        dispatchToggleEvent();
        return enabled;
      };

      const observer = new MutationObserver(() => scheduleAnnotate());
      observer.observe(body, {
        attributes: true,
        attributeFilter: ['style', 'class'],
        childList: true,
        subtree: true
      });

      window.__debugHitboxes = {
        toggle,
        isEnabled: () => enabled,
        refresh: () => annotateBlockers()
      };

      window.addEventListener(
        'keydown',
        (event) => {
          if (event.key.toLowerCase() === 'h' && event.altKey && event.shiftKey) {
            event.preventDefault();
            toggle();
          }
        },
        { passive: false }
      );

      window.addEventListener('resize', scheduleAnnotate, true);
      window.addEventListener('scroll', scheduleAnnotate, true);

      dispatchToggleEvent();
    })();
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
